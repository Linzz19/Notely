name: Build & Release Windows Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Enable Windows Long Paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute release version & repository metadata
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [major = '1', minor = '0'] = String(pkg.version || '1.0.0').split('.');
          const runNumber = process.env.GITHUB_RUN_NUMBER || '1';
          const nextVersion = `${major}.${minor}.${runNumber}`;
          pkg.version = nextVersion;
          if (process.env.GITHUB_REPOSITORY) {
            pkg.repository = {
              type: 'git',
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}.git`,
            };
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${nextVersion}\n`);
          console.log('Release version:', nextVersion, 'Repo:', process.env.GITHUB_REPOSITORY || 'local');
          '@ | node

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject Firebase config from GitHub Secret (optional)
        shell: pwsh
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: |
          if ($env:FIREBASE_APPLET_CONFIG) {
            [System.IO.File]::WriteAllText("$PWD\firebase-applet-config.json", $env:FIREBASE_APPLET_CONFIG)
            Write-Host "Loaded firebase-applet-config.json from GitHub Secret."
          } elseif (!(Test-Path "firebase-applet-config.json")) {
            Write-Error "Missing firebase-applet-config.json. Add it as repository secret FIREBASE_APPLET_CONFIG."
            exit 1
          }

      - name: Build UI bundle
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: npm run build

      - name: Build & Publish Windows Release (NSIS + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable --config electron-builder.yml --publish always

      - name: List generated release artifacts
        shell: pwsh
        run: Get-ChildItem -Path release | Select-Object Name, Length

      - name: Upload Notely Windows Executables (Backup Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Notely-Windows-EXE-v${{ env.APP_VERSION }}
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
