name: Build Windows Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Enable Windows Long Paths
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build UI bundle
        run: npm run build

      - name: Build Portable Windows .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --config electron-builder.yml --publish never

      - name: Build Windows Installer (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never
        continue-on-error: true

      - name: List generated executables
        shell: pwsh
        run: Get-ChildItem -Path release -Filter *.exe

      - name: Upload Notely Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: Notely-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error
