appId: com.notely.desktop
productName: Notely
copyright: Copyright (c) Notely
compression: normal
directories:
  output: release
npmRebuild: false
buildDependenciesFromSource: false
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: electron/icon.png
    to: electron/icon.png
win:
  icon: electron/icon.ico
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: Notely-${version}-Portable.exe
nsis:
  artifactName: Notely-Setup-${version}.exe
  warningsAsErrors: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notely
