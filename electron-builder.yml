appId: com.notely.desktop
productName: Notely
copyright: Copyright (c) Notely
compression: normal
protocols:
  - name: Notely Desktop
    schemes:
      - notely
directories:
  output: release
npmRebuild: false
buildDependenciesFromSource: false
publish:
  - provider: github
    releaseType: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/@google/**/*'
  - '!node_modules/@tailwindcss/**/*'
  - '!node_modules/@vitejs/**/*'
  - '!node_modules/vite/**/*'
  - '!node_modules/rollup/**/*'
  - '!node_modules/@rollup/**/*'
  - '!node_modules/esbuild/**/*'
  - '!node_modules/@esbuild/**/*'
  - '!node_modules/lightningcss*/**/*'
  - '!node_modules/tailwindcss/**/*'
  - '!node_modules/react/**/*'
  - '!node_modules/react-dom/**/*'
  - '!node_modules/motion/**/*'
  - '!node_modules/framer-motion/**/*'
  - '!node_modules/lucide-react/**/*'
  - '!node_modules/express/**/*'
  - '!node_modules/dotenv/**/*'
  - '!node_modules/eslint*/**/*'
  - '!node_modules/@eslint*/**/*'
  - '!node_modules/firebase/**/*'
  - '!node_modules/@firebase/**/*'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.ts'
extraResources:
  - from: electron/icon.png
    to: electron/icon.png
win:
  icon: electron/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
portable:
  artifactName: Notely-${version}-Portable.exe
nsis:
  artifactName: Notely-Setup-${version}.exe
  warningsAsErrors: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notely
